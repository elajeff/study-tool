name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Start a disposable database
        run: |
          supabase init
          supabase db start
      - name: Apply schema and run SQL tests
        run: |
          for file in supabase/schema.sql supabase/[0-9][0-9][0-9]_*.sql supabase/tests/*.sql; do
            echo "Running $file"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$file"
          done
